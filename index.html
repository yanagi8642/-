<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f0e5">
  <meta name="description" content="このサイトで公開しているページをまとめて紹介します。">
  <title>ページ一覧 | まちとあそび</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      color: #253e35;
      background: #f5f0e5;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; }
    a { color: inherit; }
    .wrap { width: min(1080px, calc(100% - 40px)); margin-inline: auto; }

    header {
      display: flex;
      min-height: 76px;
      align-items: center;
      border-bottom: 1px solid rgba(37, 62, 53, .2);
      font-size: .9rem;
      font-weight: 700;
    }

    main { padding-block: clamp(56px, 10vw, 112px); }
    .eyebrow {
      margin: 0 0 16px;
      color: #376348;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .16em;
    }

    h1 {
      max-width: 12em;
      margin: 0;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: clamp(2.5rem, 7vw, 5rem);
      line-height: 1.3;
    }

    .intro { margin: 18px 0 0; color: #64746a; line-height: 1.9; }
    .pages {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: 20px;
      margin-top: 52px;
    }

    .page-card {
      display: flex;
      min-height: 230px;
      flex-direction: column;
      align-items: flex-start;
      padding: clamp(24px, 4vw, 36px);
      border: 1px solid rgba(37, 62, 53, .18);
      border-radius: 6px;
      background: rgba(255, 255, 255, .48);
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .page-card:hover, .page-card:focus-visible {
      transform: translateY(-4px);
      border-color: #376348;
      box-shadow: 0 14px 36px rgba(37, 62, 53, .1);
    }

    .page-card:focus-visible { outline: 3px solid #dc6446; outline-offset: 4px; }
    .page-number { color: #dc6446; font-size: .75rem; font-weight: 700; letter-spacing: .12em; }
    .page-card h2 { margin: 24px 0 10px; font-size: 1.35rem; }
    .page-card p { margin: 0; color: #64746a; line-height: 1.8; }
    .page-link { margin-top: auto; padding-top: 24px; color: #376348; font-size: .9rem; font-weight: 700; }

    footer { padding-block: 24px; border-top: 1px solid rgba(37, 62, 53, .2); color: #64746a; font-size: .8rem; }
  </style>
</head>
<body>
  <header class="wrap">まちとあそび — ページ一覧</header>
  <main class="wrap">
    <p class="eyebrow">EXPLORE THE SITE</p>
    <h1>気になるページを<br>見つけよう。</h1>
    <p class="intro">このサイトで公開しているページをまとめました。カードを選んで、それぞれのページへ移動できます。</p>

    <section class="pages" aria-label="公開ページ">
      <a class="page-card" href="./machi.html">
        <span class="page-number">01 / TOWN GUIDE</span>
        <h2>鎌ケ谷のまち案内</h2>
        <p>梨の実りや歴史、暮らしの魅力など、千葉県鎌ケ谷市をご紹介します。</p>
        <span class="page-link">まち案内を見る →</span>
      </a>
    </section>
  </main>
  <footer><div class="wrap">ページ一覧</div></footer>
</body>
</html>
